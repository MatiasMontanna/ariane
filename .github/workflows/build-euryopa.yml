name: Build Euryopa

on:
  push:
    branches: [master, PE]
  pull_request:
    branches: [master, PE]
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBRW: ${{ github.workspace }}/librw
  LIBRW_REF: 15ffa585216a9a7573ecc597b19ce2fde9b935f2

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout ariane
        uses: actions/checkout@v4
        with:
          path: ariane

      - name: Checkout librw
        uses: actions/checkout@v4
        with:
          repository: Southland-FR/librw
          ref: ${{ env.LIBRW_REF }}
          path: librw

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Premake5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip" -OutFile premake5.zip
          Expand-Archive premake5.zip -DestinationPath premake5
          echo "${{ github.workspace }}\premake5" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Read version from header
        id: version
        shell: pwsh
        working-directory: ariane
        run: |
          $content = Get-Content "tools/euryopa/version.h" -Raw
          if ($content -match '#define\s+ARIANE_VERSION\s+"([^"]+)"') {
            $ver = $Matches[1]
          } else {
            $ver = "0.0.0"
          }
          $ref = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.base_ref }}" } else { "${{ github.ref_name }}" }
          $branch = if ($ref -eq "PE") { "PE" } else { "master" }
          $shortsha = "${{ github.sha }}".Substring(0, 7)
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v${ver}-${branch}-${shortsha}" >> $env:GITHUB_OUTPUT
          echo "channel=$branch" >> $env:GITHUB_OUTPUT

      - name: Generate librw project files
        shell: cmd
        working-directory: librw
        run: premake5 vs2019

      - name: Build librw
        shell: cmd
        working-directory: librw/build
        run: msbuild librw.sln /p:Configuration=Release /p:Platform=win-amd64-d3d9 /t:librw /m

      - name: Generate ariane project files
        shell: cmd
        working-directory: ariane
        run: premake5 vs2019 --channel=${{ steps.version.outputs.channel }}

      - name: Build euryopa
        shell: cmd
        working-directory: ariane/build
        run: msbuild librwgta.sln /p:Configuration=Release /p:Platform=win-amd64-d3d9 /t:librwgta;euryopa /m

      - name: Upload euryopa.exe
        uses: actions/upload-artifact@v4
        with:
          name: ariane-windows-d3d9
          path: ariane/bin/win-amd64-d3d9/Release/ariane.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ariane ${{ steps.version.outputs.version }} (${{ steps.version.outputs.channel }})
          body: |
            Ariane ${{ steps.version.outputs.version }} — channel: **${{ steps.version.outputs.channel }}**
          files: ariane/bin/win-amd64-d3d9/Release/ariane.exe
          draft: false
          prerelease: ${{ steps.version.outputs.channel == 'PE' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux x64 (OpenGL)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout ariane
        uses: actions/checkout@v4
        with:
          path: ariane

      - name: Checkout librw
        uses: actions/checkout@v4
        with:
          repository: Southland-FR/librw
          ref: ${{ env.LIBRW_REF }}
          path: librw

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libglfw3-dev is deliberately NOT installed. The distro packages split
          # GLFW into mutually exclusive single-backend builds -- on jammy
          # libglfw3 is X11-only and libglfw3-wayland is Wayland-only, both
          # claiming SONAME libglfw.so.3 -- so whichever we link against becomes
          # the only backend the released binary has. We build GLFW ourselves below
          # to get one library carrying both backends.
          #
          # GLFW 3.4 dlopens libX11/libwayland-*/libEGL/libxkbcommon at runtime,
          # so these -dev packages supply headers for the build only; they are not
          # link-time NEEDED entries and are not required at run time.
          sudo apt-get install --yes \
            libgl1-mesa-dev xauth xvfb \
            cmake \
            xorg-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Build GLFW 3.4 (X11 + Wayland)
        run: |
          set -euo pipefail
          # Pinned to the official release asset, checksum-verified the same way
          # premake5 is below. The auto-generated source tarball is not a listed
          # release asset and its bytes are not guaranteed stable, so we use the
          # .zip the GLFW project actually publishes.
          curl --fail --location --silent --show-error \
            https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip \
            --output glfw-3.4.zip
          echo "b5ec004b2712fd08e8861dc271428f048775200a2df719ccf575143ba749a3e9  glfw-3.4.zip" | sha256sum --check
          unzip -q glfw-3.4.zip
          # Both backends are the upstream default on Linux, but set them
          # explicitly so a future default change cannot silently drop one and
          # leave us shipping a half-working artifact.
          # BUILD_SHARED_LIBS must be ON: GLFW's CMake defaults it to OFF, which
          # would build only libglfw.a and leave no libglfw.so.3 to bundle.
          cmake -S glfw-3.4 -B glfw-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DGLFW_BUILD_X11=ON \
            -DGLFW_BUILD_WAYLAND=ON \
            -DGLFW_BUILD_DOCS=OFF \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF
          cmake --build glfw-build --parallel 2
          sudo cmake --install glfw-build
          sudo ldconfig
          # Installed to /usr/local so the librw/ariane build both compiles and
          # links against this exact version, instead of a 3.3.6 header paired
          # with a 3.4 runtime. Use find, not a `lib*` glob: bash does not let a
          # single `*` cross a `/`, so a glob would miss the multiarch layout that
          # Debian and Ubuntu's CMake patches produce.
          glfw_so=$(find /usr/local -name 'libglfw.so.3*' -print -quit 2>/dev/null || true)
          if [ -z "$glfw_so" ]; then
            echo "::error::no libglfw.so.3 under /usr/local; a static-only build would leave nothing to bundle"
            find /usr/local -name 'libglfw*' 2>/dev/null || true
            exit 1
          fi
          echo "glfw: $glfw_so -> $(readlink -f "$glfw_so")"
          readelf -d "$glfw_so" | grep -E 'SONAME|NEEDED'
          # Both backends dlopen their libraries at runtime, so the names only
          # appear as strings. Assert both are present now, rather than
          # discovering a single-backend artifact from a user report later.
          for backend in libX11.so.6 libwayland-client.so.0; do
            if ! strings "$glfw_so" | grep -qF "$backend"; then
              echo "::error::GLFW was built without $backend; refusing to package a single-backend binary"
              exit 1
            fi
          done
          echo "GLFW has both X11 and Wayland backends"

      - name: Install Premake5
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-linux.tar.gz \
            --output premake5.tar.gz
          echo "98c0dbf55f20d28ecc2b5fdd4a5c9bfe5ef461d26d3b023b4dfd7d75f4df3a3f  premake5.tar.gz" | sha256sum --check
          mkdir premake5
          tar --extract --gzip --file premake5.tar.gz --directory premake5
          chmod +x premake5/premake5
          premake5/premake5 --version
          echo "${{ github.workspace }}/premake5" >> "$GITHUB_PATH"

      - name: Generate librw project files
        working-directory: librw
        run: premake5 gmake2

      - name: Build librw
        working-directory: librw
        env:
          CXXFLAGS: -std=c++14
        run: make --directory build --jobs 2 config=release_linux-amd64-gl3 librw

      - name: Generate ariane project files
        working-directory: ariane
        env:
          ARIANE_CHANNEL: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          if [ "$ARIANE_CHANNEL" != PE ]; then ARIANE_CHANNEL=master; fi
          premake5 gmake2 --channel="$ARIANE_CHANNEL"

      - name: Build Ariane
        working-directory: ariane
        run: make --directory build --jobs 2 config=release_linux-amd64-gl3 euryopa

      - name: Check RUNPATH in built binary
        working-directory: ariane
        run: |
          set -uo pipefail
          # Fail fast, and loudly: an rpath that never reached the linker is
          # otherwise invisible until the bundled-runtime check much later.
          echo "--- rpath flag as generated in the makefile ---"
          grep -o -- "-Wl,-rpath,[^ ]*" build/euryopa.make | sort -u \
            || echo "  ::error::rpath flag is absent from the generated makefile"
          echo "--- dynamic section of the built binary ---"
          readelf -d bin/linux-amd64-gl3/Release/ariane
          if ! readelf -d bin/linux-amd64-gl3/Release/ariane \
               | grep -qE 'RUNPATH.*[$]ORIGIN/lib'; then
            echo "::error::binary has no \$ORIGIN/lib RUNPATH; bundled lib/ will not be found"
            exit 1
          fi
          echo "RUNPATH OK"

      - name: Smoke test OpenGL startup
        working-directory: ariane/bin/linux-amd64-gl3/Release
        run: |
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            ./ariane > smoke-test.log 2>&1
          status=$?
          set -e
          cat smoke-test.log
          test "$status" -eq 1
          grep --quiet "error: unknown game" smoke-test.log

      - name: Bundle runtime libraries
        working-directory: ariane/bin/linux-amd64-gl3/Release
        run: |
          set -euo pipefail
          mkdir -p lib
          # Bundle only the windowing library. GL/X11/Mesa are deliberately left
          # to the host: they must match the machine's actual X and GL stack, and
          # shipping our own copies tends to break rather than help.
          mapfile -t libs < <(ldd ./ariane \
            | grep -oE '/[^ ]*lib(glfw|SDL2)[^ ]*\.so[^ ]*' | sort -u)
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "::warning::no glfw/SDL2 runtime library found to bundle"
          fi
          for so in "${libs[@]}"; do
            [ -e "$so" ] || continue
            cp -L "$so" lib/
            echo "bundled $(basename "$so")"
          done
          # Re-check the backend on the copy that actually ships. The build step
          # already asserted this, but that was on the installed library; this
          # catches a wrong file being copied into lib/ by the loop above.
          if [ -e lib/libglfw.so.3 ]; then
            for backend in libX11.so.6 libwayland-client.so.0; do
              if ! strings lib/libglfw.so.3 | grep -qF "$backend"; then
                echo "::error::bundled libglfw.so.3 is missing $backend (single-backend artifact)"
                exit 1
              fi
            done
            echo "bundled libglfw.so.3 carries both X11 and Wayland backends"
          else
            echo "::error::libglfw.so.3 was not bundled; the binary would not start"
            exit 1
          fi

      - name: Package Linux artifact
        working-directory: ariane
        run: |
          tar --create --gzip --file ariane-linux-x64.tar.gz \
            --directory bin/linux-amd64-gl3/Release ariane lib
          sha256sum ariane-linux-x64.tar.gz > ariane-linux-x64.tar.gz.sha256

      - name: Verify bundled runtime resolves
        run: |
          set -euo pipefail
          # Test the extracted tarball, not the build tree: this is what users get,
          # and it catches packaging mistakes (e.g. forgetting lib/) that a test
          # in the build directory would miss.
          rm -rf ariane-verify && mkdir ariane-verify
          tar --extract --gzip --file ariane/ariane-linux-x64.tar.gz \
            --directory ariane-verify
          cd ariane-verify
          test -x ariane
          ls lib
          # Print the dynamic section unconditionally -- grepping first and dying
          # under `set -e` hides the reason the check failed.
          readelf -d ./ariane || true
          if ! readelf -d ./ariane | grep -qE 'RUNPATH.*[$]ORIGIN/lib'; then
            echo "::error::\$ORIGIN did not survive make -> shell -> ld"
            exit 1
          fi
          if ldd ./ariane | grep -E 'glfw|SDL2' | grep -qv 'lib/'; then
            echo "::error::windowing library is not resolving from the bundled lib/"
            ldd ./ariane | grep -E 'glfw|SDL2'
            exit 1
          fi
          # Assert the shipped artifact -- not just the build tree -- offers both
          # backends, so the release can actually run native Wayland.
          for backend in libX11.so.6 libwayland-client.so.0; do
            if ! strings lib/libglfw.so.3 | grep -qF "$backend"; then
              echo "::error::shipped libglfw.so.3 is missing $backend"
              exit 1
            fi
          done
          # The X11 smoke test below only proves the X11 backend. GLFW dlopens
          # the Wayland libraries, so ldd cannot prove they are present -- we can
          # only confirm the backend is compiled in. Runtime presence of
          # libwayland-* is the host's responsibility and is documented in the
          # README.
          echo "shipped GLFW exposes both backends"
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            ./ariane > smoke-test-bundled.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep --quiet "error: unknown game" smoke-test-bundled.log
          echo "bundled runtime OK"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ariane-linux-x64
          path: |
            ariane/ariane-linux-x64.tar.gz
            ariane/ariane-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
